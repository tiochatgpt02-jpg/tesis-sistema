<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temas - Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2>Temas Asignados</h2>
        <div class="list-group">
            {% for topic in topics %}
            <div class="list-group-item">
                <h5>{{ topic.title }}</h5>
                <p>{{ topic.description|plain_summary }}</p>
                <span class="badge bg-secondary">Grado {{ topic.grade }}</span>
                <span class="badge bg-info">{{ topic.status }}</span>
            </div>
            {% endfor %}
        </div>
        <a href="/student" class="btn btn-secondary mt-3">Volver</a>
    </div>
</body>
</html>
