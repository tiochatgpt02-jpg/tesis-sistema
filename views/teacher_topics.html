<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temas - Profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2>Temas de Aprendizaje</h2>
        <div class="list-group">
            {% for topic in topics %}
            <div class="list-group-item">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h5>{{ topic.title }}</h5>
                        <p>{{ topic.description }}</p>
                    </div>
                    <div>
                        <span class="badge bg-secondary">Grado {{ topic.grade }}</span>
                        <span class="badge bg-info text-dark">{{ topic.status }}</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <a href="/teacher" class="btn btn-secondary mt-3">Volver</a>
    </div>
</body>
</html>
