<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reabrir examen</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:720px"><a href="/teacher/settings">Volver a reglas de calificación</a><h1 class="mt-4">Reabrir examen</h1><p>Autoriza un nuevo intento para un alumno del grado y sección del examen. Se conserva el historial anterior.</p>
{% if message %}<p role="status" class="alert alert-info">{{ message }}</p>{% endif %}
<form method="post" class="card p-4"><label for="student">Alumno</label><select id="student" name="student_id" class="form-select mb-3" required>{% for s in students %}<option value="{{ s.id }}">{{ s.first_name }} {{ s.last_name }} - {{ s.grade }} {{ s.section or 'A' }}</option>{% endfor %}</select>
<label for="exam">Examen</label><select id="exam" name="assessment_id" class="form-select mb-3" required>{% for a in assessments %}<option value="{{ a.id }}">{{ a.title }} - ID {{ a.id }}</option>{% endfor %}</select><button class="btn btn-primary">Autorizar nuevo intento</button></form></main></body></html>
