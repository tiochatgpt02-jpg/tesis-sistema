<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Interactivo - IA IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .game-area { display: flex; justify-content: space-between; gap: 30px; margin-top: 20px; flex-wrap: wrap; }
        .draggable-list, .dropzone-list { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 48%; }
        .draggable-item { background: #3498db; color: white; padding: 15px; border-radius: 8px; cursor: grab; text-align: center; font-weight: bold; }
        .dropzone { background: #ecf0f1; padding: 15px; border-radius: 8px; border: 2px dashed #bdc3c7; min-height: 65px; display: flex; align-items: center; justify-content: center; color: #7f8c8d; }
        .dropzone.hovered { background: #e8f8f5; border-color: #2ecc71; border-style: solid; }
    </style>
</head>
<body>
<div class="container">
    <h2 id="game-title">Cargando juego...</h2>
    <p class="text-muted" id="game-instrucciones">Arrastra el término a su definición correcta.</p>
    <div id="level-buttons" class="d-flex gap-2 flex-wrap mt-3"></div>
    <div class="game-area">
        <div class="draggable-list" id="draggable-list"></div>
        <div class="dropzone-list" id="dropzone-list"></div>
    </div>
    <button id="verify-button" class="btn btn-success w-100 mt-4" type="button" onclick="verificarRespuestas()">Verificar respuestas</button>
    <div class="mt-3 fw-bold text-center" id="feedback-msg"></div>
    <a href="/student/" class="btn btn-outline-secondary mt-3">Volver al panel</a>
</div>
<script>
    const datosJuego = {{ juego_json | tojson }};
    document.getElementById('game-title').innerText = datosJuego.titulo || 'Juego educativo';
    document.getElementById('game-instrucciones').innerText = datosJuego.instrucciones || 'Arrastra el término a su definición correcta.';

    const niveles = datosJuego.niveles?.length ? datosJuego.niveles : [{ tipo: 'relacionar', titulo: 'Une las parejas', pares: datosJuego.pares || [] }];
    const levelButtons = document.getElementById('level-buttons');
    niveles.forEach((level, index) => {
        const button = document.createElement('button');
        button.className = `btn ${index === 0 ? 'btn-success' : 'btn-outline-success'}`;
        button.textContent = `Nivel ${index + 1}: ${level.titulo}`;
        button.onclick = () => { document.querySelectorAll('#level-buttons button').forEach(item => item.className = 'btn btn-outline-success'); button.className = 'btn btn-success'; renderLevel(level); };
        levelButtons.appendChild(button);
    });

    function renderLevel(level) {
        const listaArrastrable = document.getElementById('draggable-list');
        const listaDestino = document.getElementById('dropzone-list');
        listaArrastrable.innerHTML = '';
        listaDestino.innerHTML = '';
        document.getElementById('feedback-msg').textContent = '';
        document.getElementById('verify-button').hidden = level.tipo !== 'relacionar';
        if (level.tipo === 'relacionar') renderPairs(level.pares || [], listaArrastrable, listaDestino);
        else if (level.tipo === 'opciones') renderOptions(level);
        else renderOrder(level);
    }

    function renderPairs(pares, listaArrastrable, listaDestino) {
    pares.slice().sort(() => Math.random() - 0.5).forEach((par) => {
        const itemArrastrable = document.createElement('div');
        itemArrastrable.classList.add('draggable-item');
        itemArrastrable.draggable = true;
        itemArrastrable.innerText = par.termino;
        itemArrastrable.addEventListener('dragstart', (event) => event.dataTransfer.setData('text/plain', par.termino));
        listaArrastrable.appendChild(itemArrastrable);

        const zonaDestino = document.createElement('div');
        zonaDestino.classList.add('dropzone');
        zonaDestino.innerHTML = `<span>${par.definicion}</span>`;
        zonaDestino.dataset.correcta = par.definicion;
        zonaDestino.addEventListener('dragover', (event) => { event.preventDefault(); zonaDestino.classList.add('hovered'); });
        zonaDestino.addEventListener('dragleave', () => zonaDestino.classList.remove('hovered'));
        zonaDestino.addEventListener('drop', (event) => {
            event.preventDefault();
            zonaDestino.classList.remove('hovered');
            zonaDestino.textContent = event.dataTransfer.getData('text/plain');
        });
        listaDestino.appendChild(zonaDestino);
    });
    }

    function renderOptions(level) {
        const listaDestino = document.getElementById('dropzone-list');
        listaDestino.innerHTML = (level.preguntas || []).map((item, index) => `<div class="dropzone" style="display:block;text-align:left"><strong>${index + 1}. ${item.pregunta || item.question}</strong>${(item.opciones || item.options || []).map(option => `<button class="btn btn-outline-primary d-block w-100 mt-2 option" data-correct="${item.respuesta || item.answer}" data-value="${option}">${option}</button>`).join('')}</div>`).join('');
        listaDestino.querySelectorAll('.option').forEach(button => button.onclick = () => { button.style.background = button.dataset.value === button.dataset.correct ? '#d1e7dd' : '#f8d7da'; });
    }

    function renderOrder(level) {
        const listaDestino = document.getElementById('dropzone-list');
        const steps = (level.pasos || []).slice().sort(() => Math.random() - 0.5);
        let next = 0;
        listaDestino.innerHTML = '<p class="text-muted">Pulsa los pasos en orden.</p>' + steps.map(step => `<button class="btn btn-outline-primary d-block w-100 mb-2 order" data-step="${step}">${step}</button>`).join('');
        listaDestino.querySelectorAll('.order').forEach(button => button.onclick = () => { if (button.dataset.step === level.pasos[next]) { button.disabled = true; button.className = 'btn btn-success d-block w-100 mb-2 order'; next += 1; } });
    }

    renderLevel(niveles[0]);

    function verificarRespuestas() {
        let correctas = 0;
        document.querySelectorAll('.dropzone').forEach((zona) => {
            const terminoEnZona = zona.innerText.trim();
            const pares = niveles[0].pares || datosJuego.pares || [];
            const parCorrecto = pares.find((par) => par.termino === terminoEnZona);
            if (parCorrecto && parCorrecto.definicion === zona.dataset.correcta) {
                zona.style.background = '#e8f8f5';
                zona.style.borderColor = '#2ecc71';
                correctas += 1;
            } else {
                zona.style.background = '#fdecea';
                zona.style.borderColor = '#e74c3c';
            }
        });
        const feedback = document.getElementById('feedback-msg');
        if (correctas === (niveles[0].pares || datosJuego.pares || []).length) {
            feedback.textContent = 'Excelente. Todas correctas.';
            feedback.className = 'mt-3 fw-bold text-center text-success';
        } else {
            feedback.textContent = `Tuviste ${correctas} de ${(niveles[0].pares || datosJuego.pares || []).length} correctas.`;
            feedback.className = 'mt-3 fw-bold text-center text-danger';
        }
    }
</script>
</body>
</html>
