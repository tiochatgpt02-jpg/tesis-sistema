<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Computación Primaria | Sistema Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="auth-body">
<div class="auth-page">
    <div class="auth-card shadow-lg">
        <!-- Banner Temático del Curso de Computación Primaria -->
        <div class="auth-card-banner text-center position-relative">
            <img src="/static/img/Logo%20Colegio.jpeg" alt="Logo del colegio" class="img-fluid auth-banner-img mb-2">
            <div class="auth-banner-overlay">
                <h1 class="auth-title">Aula Virtual de Computación</h1>
                <p class="auth-subtitle">Curso Inteligente IA · Grados 4° a 6° Primaria</p>
            </div>
        </div>

        <div class="auth-card-body">
            {% if error %}
            <div class="alert alert-danger py-2 rounded-3 shadow-sm d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i> 
                <div>{{ error }}</div>
            </div>
            {% endif %}
            
            <form method="post" class="auth-form">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">
                        <i class="bi bi-person-fill me-1 text-primary"></i> Usuario
                    </label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Usuario registrado en la base de datos" required autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary">
                        <i class="bi bi-key-fill me-1 text-primary"></i> Contraseña
                    </label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="grade-select" class="form-label fw-semibold text-secondary">
                        <i class="bi bi-people-fill me-1 text-primary"></i> Grado
                    </label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text"><i class="bi bi-diagram-3"></i></span>
                        <select id="grade-select" name="grade" class="form-select form-select-sm border-0">
                            <option value="" selected>Selecciona tu grado</option>
                            <option value="4">4° Grado</option>
                            <option value="5">5° Grado</option>
                            <option value="6">6° Grado</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-auth-submit w-100 py-3 rounded-3 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar a Computación
                </button>
            </form>
        </div>
    </div>
</div>


</body>
</html>
