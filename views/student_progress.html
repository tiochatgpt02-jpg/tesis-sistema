<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso - Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2>Seguimiento de Progreso</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <p>Progreso general: {{ progress.overall }}%</p>
                <p>Temas completados: {{ progress.completed }}</p>
                <p>Tiempo de estudio: {{ progress.study_time }}</p>
            </div>
        </div>
        <a href="/student" class="btn btn-secondary mt-3">Volver</a>
    </div>
</body>
</html>
